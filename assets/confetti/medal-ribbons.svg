<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160" fill="none">
  <defs>
    <!-- Red ribbon gradients -->
    <linearGradient id="ribbon-red-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="50%" stop-color="#D32F2F"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <linearGradient id="ribbon-red-r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF5350"/>
      <stop offset="50%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#C62828"/>
    </linearGradient>
    <linearGradient id="ribbon-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <filter id="ribbon-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Left ribbon tail (tilted -20 deg) -->
  <g transform="translate(120, 20) rotate(-20)" filter="url(#ribbon-shadow)">
    <!-- Main red strip with swallowtail notch -->
    <path d="M-22,0 L22,0 L22,105 L0,84 L-22,105 Z" fill="url(#ribbon-red-l)"/>
    <!-- Left gold edge stripe -->
    <path d="M-22,0 L-16,0 L-16,99 L-22,105 Z" fill="url(#ribbon-gold)"/>
    <!-- Right gold edge stripe -->
    <path d="M16,0 L22,0 L22,105 L16,99 Z" fill="url(#ribbon-gold)"/>
    <!-- Center subtle crease line -->
    <path d="M0,0 L0,84" stroke="rgba(0,0,0,0.18)" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Right ribbon tail (tilted +20 deg) -->
  <g transform="translate(120, 20) rotate(20)" filter="url(#ribbon-shadow)">
    <!-- Main red strip with swallowtail notch -->
    <path d="M-22,0 L22,0 L22,105 L0,84 L-22,105 Z" fill="url(#ribbon-red-r)"/>
    <!-- Left gold edge stripe -->
    <path d="M-22,0 L-16,0 L-16,99 L-22,105 Z" fill="url(#ribbon-gold)"/>
    <!-- Right gold edge stripe -->
    <path d="M16,0 L22,0 L22,105 L16,99 Z" fill="url(#ribbon-gold)"/>
    <!-- Center subtle crease line -->
    <path d="M0,0 L0,84" stroke="rgba(0,0,0,0.18)" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Bow tie / Ribbon knot in the center (领结) -->
  <g transform="translate(120, 24)" filter="url(#ribbon-shadow)">
    <!-- Left wing of bow tie -->
    <path d="M-4,0 C-18,-14 -42,-18 -46,-4 C-48,10 -24,18 -4,6 Z" fill="url(#ribbon-red-l)" stroke="#B71C1C" stroke-width="1"/>
    <path d="M-4,-2 C-16,-10 -36,-14 -40,-4 C-42,6 -22,12 -4,3 Z" fill="url(#ribbon-gold)" opacity="0.55"/>

    <!-- Right wing of bow tie -->
    <path d="M4,0 C18,-14 42,-18 46,-4 C48,10 24,18 4,6 Z" fill="url(#ribbon-red-r)" stroke="#B71C1C" stroke-width="1"/>
    <path d="M4,-2 C16,-10 36,-14 40,-4 C42,6 22,12 4,3 Z" fill="url(#ribbon-gold)" opacity="0.55"/>

    <!-- Center knot buckle -->
    <ellipse cx="0" cy="1" rx="11" ry="13" fill="url(#ribbon-gold)" stroke="#D99E10" stroke-width="1.5"/>
    <ellipse cx="0" cy="1" rx="7" ry="9" fill="url(#ribbon-red-l)"/>
    <ellipse cx="0" cy="0" rx="3" ry="4" fill="#FFFFFF" opacity="0.6"/>
  </g>
</svg>