<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 330" width="350" height="330" fill="none">
  <defs>
    <linearGradient id="gold-stem" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D99E10"/>
      <stop offset="50%" stop-color="#F5C62B"/>
      <stop offset="100%" stop-color="#FFE066"/>
    </linearGradient>
    <linearGradient id="gold-grain" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#CF910C"/>
      <stop offset="60%" stop-color="#F7C934"/>
      <stop offset="100%" stop-color="#FFEB80"/>
    </linearGradient>
    <linearGradient id="gold-grain-hl" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F7C934" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#A67305" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Left stem arc -->
  <path d="M175,308 C115,305 40,245 42,150 C43,105 70,60 102,35" stroke="url(#gold-stem)" stroke-width="3.8" stroke-linecap="round" fill="none"/>
  <!-- Right stem arc -->
  <path d="M175,308 C235,305 310,245 308,150 C307,105 280,60 248,35" stroke="url(#gold-stem)" stroke-width="3.8" stroke-linecap="round" fill="none"/>

